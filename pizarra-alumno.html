<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pizarra — Wediom</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{ --accent:#2F5FEC; --accent-soft:#EAF0FF; --border:#E3E7F0; --muted:#6b7385; --bg:#F4F6FA; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);}
  #app{display:flex;flex-direction:column;height:100%;}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .brand{font-weight:800;color:var(--accent);font-size:16px;margin-right:6px;}
  input{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;}
  .btn{border:none;background:var(--accent-soft);color:var(--accent);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn.primary{background:var(--accent);color:#fff;}
  .swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--border);}
  #status{font-size:12px;color:var(--muted);margin-left:auto;}
  #canvasWrap{flex:1;position:relative;background:#fff;}
  #wbCanvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}
  #joinOverlay{position:absolute;inset:0;background:rgba(244,246,250,.97);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px;text-align:center;z-index:10;}
  #joinOverlay.hidden{display:none;}
  #joinOverlay input{width:220px;text-align:center;}
  #modeToggle{display:flex;gap:4px;}
  .wb-text-box{position:absolute;min-width:100px;max-width:70%;background:rgba(255,255,255,.85);border:1px dashed rgba(0,0,0,.3);font-size:18px;font-family:inherit;padding:3px 6px;border-radius:4px;resize:none;overflow:hidden;pointer-events:auto;outline:none;line-height:1.3;}
  .wb-text-box:focus{border-color:var(--accent);border-style:solid;background:#fff;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="brand">We<span style="font-weight:600;opacity:.8">diom</span></span>
    <div id="modeToggle">
      <button class="btn primary" id="btnModeDraw">✏️</button>
      <button class="btn" id="btnModeText">🔤</button>
    </div>
    <span class="swatch" style="background:#e5484d" onclick="setWbColor('#e5484d')"></span>
    <span class="swatch" style="background:#f5a524" onclick="setWbColor('#f5a524')"></span>
    <span class="swatch" style="background:#2F5FEC" onclick="setWbColor('#2F5FEC')"></span>
    <span class="swatch" style="background:#2ecc71" onclick="setWbColor('#2ecc71')"></span>
    <button class="btn" id="btnClear">🗑️ Borrar</button>
    <span id="status">Conectando…</span>
  </div>
  <div id="canvasWrap">
    <canvas id="wbCanvas"></canvas>
    <div id="wbTextLayer" style="position:absolute;inset:0;pointer-events:none;"></div>
    <div id="joinOverlay">
      <div style="font-weight:800;color:#2F5FEC;font-size:18px;">We<span style="font-weight:600">diom</span> — Pizarra</div>
      <p style="font-size:13px;color:#6b7385;max-width:280px;">Pide a tu profesor(a) el código de la sala si no se cargó automáticamente.</p>
      <input id="roomInput" placeholder="Código de sala">
      <button class="btn primary" id="btnJoin">Entrar</button>
      <p id="joinError" style="font-size:12px;color:#e5484d;max-width:280px;display:none;"></p>
    </div>
  </div>
</div>

<script>
let FIREBASE_CONFIG = null;
let fbApp = null, fbDb = null;
let currentRoom = null;
let roomStrokesRef = null, roomClearedRef = null, roomTextsRef = null;
let sentStrokeKeys = new Set();
let wbDrawing = false, wbCurrentStroke = null, wbColor = '#e5484d';
let wbCanvas, wbCtx;
let wbMode = 'draw';
let wbTextEls = {};
let wbTextSyncTimers = {};

function setWbColor(c){ wbColor = c; }

function setWbMode(mode){
  wbMode = mode;
  const bDraw = document.getElementById('btnModeDraw');
  const bText = document.getElementById('btnModeText');
  if(mode==='draw'){
    bDraw.classList.add('primary'); bText.classList.remove('primary');
    wbCanvas.style.cursor = 'crosshair';
  } else {
    bText.classList.add('primary'); bDraw.classList.remove('primary');
    wbCanvas.style.cursor = 'text';
  }
}

function resizeWbCanvas(){
  if(!wbCanvas) return;
  const rect = wbCanvas.parentElement.getBoundingClientRect();
  if(rect.width===0 || rect.height===0) return;
  wbCanvas.width = rect.width;
  wbCanvas.height = rect.height;
}
window.addEventListener('resize', resizeWbCanvas);

function normPoint(x,y,w,h){ return { x: x/w, y: y/h }; }

function drawStrokeOnCanvas(stroke){
  if(!stroke || !Array.isArray(stroke.points) || stroke.points.length < 2 || !wbCtx) return;
  wbCtx.beginPath();
  wbCtx.strokeStyle = stroke.color || '#e5484d';
  wbCtx.lineWidth = 3;
  wbCtx.lineCap = 'round';
  const p0 = stroke.points[0];
  wbCtx.moveTo(p0.x * wbCanvas.width, p0.y * wbCanvas.height);
  for(let i=1;i<stroke.points.length;i++){
    const p = stroke.points[i];
    wbCtx.lineTo(p.x * wbCanvas.width, p.y * wbCanvas.height);
  }
  wbCtx.stroke();
}
function clearWbCanvas(){ if(wbCtx && wbCanvas) wbCtx.clearRect(0,0,wbCanvas.width, wbCanvas.height); }

function clearWbTexts(){
  Object.values(wbTextEls).forEach(el=>el.remove());
  wbTextEls = {};
}
function autoGrowTextBox(el){
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}
function createTextElement(id, xFrac, yFrac, initialText, color){
  const layer = document.getElementById('wbTextLayer');
  const el = document.createElement('textarea');
  el.className = 'wb-text-box';
  el.rows = 1;
  el.placeholder = 'Escribe aquí…';
  el.value = initialText || '';
  el.style.left = (xFrac*100) + '%';
  el.style.top = (yFrac*100) + '%';
  el.style.color = color || wbColor;
  el.addEventListener('input', ()=>{
    autoGrowTextBox(el);
    clearTimeout(wbTextSyncTimers[id]);
    wbTextSyncTimers[id] = setTimeout(()=>{
      if(roomTextsRef) roomTextsRef.child(id).update({ text: el.value, updatedAt: Date.now() });
    }, 200);
  });
  el.addEventListener('blur', ()=>{
    if(!el.value.trim() && roomTextsRef){
      roomTextsRef.child(id).remove();
      el.remove();
      delete wbTextEls[id];
    }
  });
  layer.appendChild(el);
  wbTextEls[id] = el;
  autoGrowTextBox(el);
  return el;
}
function placeNewTextBox(xFrac, yFrac){
  if(!roomTextsRef) return;
  const ref = roomTextsRef.push();
  const el = createTextElement(ref.key, xFrac, yFrac, '', wbColor);
  ref.set({ x: xFrac, y: yFrac, text: '', color: wbColor, updatedAt: Date.now() })
    .catch(err=> document.getElementById('status').textContent = '❌ Sin permiso de escritura: ' + err.message);
  setTimeout(()=> el.focus(), 0);
}

function joinRoom(roomCode){
  if(!fbDb){ document.getElementById('status').textContent = '⚠️ No se pudo conectar (revisa tu internet).'; return; }
  if(roomStrokesRef) roomStrokesRef.off();
  if(roomClearedRef) roomClearedRef.off();
  if(roomTextsRef) roomTextsRef.off();
  currentRoom = roomCode;
  clearWbCanvas();
  clearWbTexts();
  sentStrokeKeys = new Set();
  roomStrokesRef = fbDb.ref('rooms/' + roomCode + '/strokes');
  roomClearedRef = fbDb.ref('rooms/' + roomCode + '/clearedAt');
  roomTextsRef = fbDb.ref('rooms/' + roomCode + '/texts');

  const onErr = (err)=> document.getElementById('status').textContent = '❌ Firebase: ' + err.message;

  roomStrokesRef.on('child_added', snap=>{
    if(sentStrokeKeys.has(snap.key)) return;
    drawStrokeOnCanvas(snap.val());
  }, onErr);
  roomClearedRef.on('value', ()=>{ clearWbCanvas(); clearWbTexts(); }, onErr);

  roomTextsRef.on('child_added', snap=>{
    const id = snap.key, data = snap.val();
    if(wbTextEls[id]) return;
    createTextElement(id, data.x, data.y, data.text, data.color);
  }, onErr);
  roomTextsRef.on('child_changed', snap=>{
    const id = snap.key, data = snap.val();
    const el = wbTextEls[id];
    if(!el){ createTextElement(id, data.x, data.y, data.text, data.color); return; }
    if(document.activeElement === el) return;
    el.value = data.text;
    autoGrowTextBox(el);
  }, onErr);
  roomTextsRef.on('child_removed', snap=>{
    const id = snap.key;
    if(wbTextEls[id]){ wbTextEls[id].remove(); delete wbTextEls[id]; }
  }, onErr);

  fbDb.ref('rooms/' + roomCode + '/ping').set(Date.now())
    .then(()=>{
      document.getElementById('status').textContent = '✅ Conectado a "' + roomCode + '"';
      document.getElementById('joinOverlay').classList.add('hidden');
    })
    .catch(err=>{
      document.getElementById('status').textContent = '❌ Sin permiso de escritura';
      const errEl = document.getElementById('joinError');
      errEl.textContent = '⚠️ No se pudo conectar: ' + err.message + ' — pídele a tu profesor(a) que revise la configuración.';
      errEl.style.display = 'block';
    });
}

function sendStroke(stroke){
  if(!roomStrokesRef) return;
  const ref = roomStrokesRef.push();
  sentStrokeKeys.add(ref.key);
  ref.set({ points: stroke.points, color: stroke.color, ts: Date.now() })
    .catch(err=> document.getElementById('status').textContent = '❌ No se pudo enviar el trazo: ' + err.message);
}

document.getElementById('btnClear').addEventListener('click', ()=>{
  if(!currentRoom || !fbDb) return;
  if(!confirm('¿Borrar todo lo escrito en la pizarra para todos?')) return;
  fbDb.ref('rooms/' + currentRoom + '/strokes').remove();
  fbDb.ref('rooms/' + currentRoom + '/texts').remove();
  fbDb.ref('rooms/' + currentRoom + '/clearedAt').set(Date.now());
});
document.getElementById('btnModeDraw').addEventListener('click', ()=> setWbMode('draw'));
document.getElementById('btnModeText').addEventListener('click', ()=> setWbMode('text'));

function initCanvas(){
  wbCanvas = document.getElementById('wbCanvas');
  wbCtx = wbCanvas.getContext('2d');
  resizeWbCanvas();

  function pos(e){
    const r = wbCanvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  wbCanvas.addEventListener('pointerdown', (e)=>{
    if(!currentRoom) return;
    const p = pos(e);
    if(wbMode === 'text'){
      placeNewTextBox(p.x/wbCanvas.width, p.y/wbCanvas.height);
      return;
    }
    wbDrawing = true;
    wbCurrentStroke = { color: wbColor, points: [normPoint(p.x,p.y,wbCanvas.width,wbCanvas.height)] };
    wbCtx.beginPath();
    wbCtx.moveTo(p.x, p.y);
  });
  wbCanvas.addEventListener('pointermove', (e)=>{
    if(!wbDrawing) return;
    const p = pos(e);
    wbCtx.lineTo(p.x, p.y);
    wbCtx.strokeStyle = wbColor;
    wbCtx.lineWidth = 3;
    wbCtx.lineCap = 'round';
    wbCtx.stroke();
    wbCurrentStroke.points.push(normPoint(p.x,p.y,wbCanvas.width,wbCanvas.height));
  });
  window.addEventListener('pointerup', ()=>{
    if(!wbDrawing) return;
    wbDrawing = false;
    if(wbCurrentStroke && wbCurrentStroke.points.length>1) sendStroke(wbCurrentStroke);
    wbCurrentStroke = null;
  });
}

document.getElementById('btnJoin').addEventListener('click', ()=>{
  const code = (document.getElementById('roomInput').value || '').trim();
  if(!code){ alert('Escribe el código que te dio tu profesor(a).'); return; }
  joinRoom(code);
});

async function init(){
  initCanvas();
  const status = document.getElementById('status');
  try{
    const res = await fetch('firebase-config.json');
    if(!res.ok) throw new Error('No se encontró firebase-config.json');
    FIREBASE_CONFIG = await res.json();
    if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith('PON_AQUI')){
      status.textContent = '⚠️ Tu profesor(a) aún no configuró la pizarra.';
      return;
    }
    fbApp = firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.database();
    status.textContent = 'Listo';
  }catch(e){
    status.textContent = '⚠️ No se pudo cargar la configuración de la pizarra.';
    console.error(e);
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const roomFromUrl = params.get('room');
  if(roomFromUrl){
    document.getElementById('roomInput').value = roomFromUrl;
    joinRoom(roomFromUrl);
  }
}
init();
</script>
</body>
</html>
